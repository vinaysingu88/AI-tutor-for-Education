<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor | Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="container nav-container">
            <a href="index.html" class="logo"><div class="logo-icon">AI</div> AI Tutor</a>
        </div>
    </nav>
    <div class="auth-wrapper">
        <div class="glass-card auth-card">
            <h2 style="text-align: center; margin-bottom: 24px;">Create an Account</h2>
            <form action="index.html">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="toggle-pwd">Show</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Sign Up</button>
                <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--color-text-muted);">
                    Already have an account? <a href="login.html" style="color: var(--color-bunker); font-weight: 600;">Log in</a>
                </p>
            </form>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
