<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor | Attendance Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Dashboard Header */
        .dashboard-header { 
            margin: 40px 0 32px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .dashboard-header h1 { 
            font-size: 2rem; 
            color: var(--color-bunker); 
            font-weight: 800;
        }

        /* Stat Cards Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--color-white);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 28px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--color-forest);
        }

        .stat-card.stat-absent::before {
            background: #dc2626;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: rgba(39, 172, 31, 0.2);
        }

        .stat-label { 
            color: var(--color-text-muted); 
            font-size: 0.9rem; 
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value { 
            font-size: 2.8rem; 
            font-weight: 800; 
            color: var(--color-bunker);
            margin-top: 12px;
            line-height: 1;
        }

        .stat-card.stat-percent .stat-value {
            color: var(--color-forest);
        }

        .stat-card.stat-present .stat-value {
            color: var(--color-forest);
        }

        .stat-card.stat-absent .stat-value {
            color: #dc2626;
        }

        .stat-subtext {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-top: 8px;
        }

        /* Filter Section */
        .filter-section {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .filter-label {
            font-weight: 600;
            color: var(--color-bunker);
            font-size: 0.95rem;
        }

        .filters { 
            display: flex; 
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn { 
            padding: 8px 20px; 
            border-radius: 8px; 
            border: 1.5px solid var(--glass-border);
            background: var(--color-white); 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        .filter-btn:hover {
            border-color: var(--color-forest);
            background: rgba(39, 172, 31, 0.05);
        }

        .filter-btn.active { 
            background: var(--color-forest); 
            color: white;
            border-color: var(--color-forest);
            box-shadow: 0 4px 12px rgba(39, 172, 31, 0.3);
        }

        /* Table Styles */
        .table-wrapper {
            background: var(--color-white);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-bottom: 40px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse;
        }

        th { 
            background: linear-gradient(135deg, rgba(39, 172, 31, 0.05) 0%, rgba(255, 255, 255, 0.5) 100%);
            padding: 16px 24px; 
            text-align: left; 
            font-weight: 600; 
            color: var(--color-text-muted);
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td { 
            padding: 14px 24px; 
            border-bottom: 1px solid var(--glass-border);
            color: var(--color-bunker);
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover { 
            background: rgba(39, 172, 31, 0.03);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Analytics Section */
        .analytics-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr;
            gap: 24px; 
            margin-top: 40px;
        }

        .analytics-card {
            background: var(--color-white);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 32px;
            box-shadow: var(--shadow-sm);
        }

        .analytics-card h3 {
            font-size: 1.1rem;
            color: var(--color-bunker);
            margin-bottom: 24px;
            font-weight: 700;
        }

        /* Pie Chart */
        .pie-chart { 
            width: 160px; 
            height: 160px; 
            border-radius: 50%; 
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(39, 172, 31, 0.15);
        }

        .pie-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.9rem;
            margin-top: 16px;
        }

        .pie-legend-item{
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* Progress Bar */
        .progress-section {
            margin-top: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .progress-header span {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        .progress-value {
            font-weight: 700;
            color: var(--color-forest);
        }

        .progress-bar { 
            width: 100%; 
            height: 10px; 
            background: var(--color-gray); 
            border-radius: 12px; 
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
        }

        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, var(--color-forest) 0%, var(--color-screamin) 100%);
            width: 85%;
            border-radius: 12px;
            transition: width 0.5s ease;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-muted);
        }

        .empty-state p {
            margin-top: 12px;
            font-size: 0.95rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .dashboard-header h1 {
                font-size: 1.5rem;
            }

            .filter-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .analytics-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container" style="padding-bottom: 80px;">
        <!-- Dashboard Header -->
        <div class="dashboard-header">
            <h1>Attendance Dashboard</h1>
            <button class="btn-primary">Generate Report</button>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid" id="statsContainer">
            <!-- Stats will be populated by TypeScript -->
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <span class="filter-label">Filter by Status:</span>
            <div class="filters" id="filterContainer">
                <!-- Filters will be populated by TypeScript -->
            </div>
        </div>

        <!-- Attendance Table -->
        <div class="table-wrapper">
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Table rows will be populated by TypeScript -->
                </tbody>
            </table>
        </div>

        <!-- Analytics Section -->
        <div class="analytics-grid">
            <!-- Pie Chart Card -->
            <div class="analytics-card">
                <h3>Today&apos;s Attendance Ratio</h3>
                <div style="text-align: center;">
                    <div class="pie-chart" id="pieChart"></div>
                    <div class="pie-legend" id="pieLegend">
                        <!-- Legend items will be populated by TypeScript -->
                    </div>
                </div>
            </div>

            <!-- Progress Card -->
            <div class="analytics-card">
                <h3>Weekly Attendance Progress</h3>
                <div id="progressContainer">
                    <!-- Progress items will be populated by TypeScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/attendance-dashboard.js"></script>
</body>
</html>
